name: TESENA Demo CI

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
      timezone: "Europe/Prague"

permissions:
  contents: read

env:
  CI: "true"

jobs:
  quality:
    name: Quality / Linters
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.18"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Install backend dependencies
        run: uv sync --all-packages

      - name: Install frontend dependencies
        run: bun ci

      - name: Run quality gates
        id: quality
        run: uv run prek run --all-files --show-diff-on-failure

      - name: Verify generated files are synchronized
        run: git diff --exit-code

      - name: Quality summary
        if: always()
        env:
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
        run: |
          {
            echo "### Quality / Linters"
            if [ "$QUALITY_OUTCOME" = "success" ]; then
              echo "✅ **PASSED**"
            else
              echo "❌ **FAILED**"
            fi
            echo
            echo "- Biome"
            echo "- Ruff check"
            echo "- Ruff format"
            echo "- MyPy"
            echo "- ty"
            echo "- Generated OpenAPI client consistency"
            echo "- zizmor"
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend / Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.18"

      - name: Start dependencies
        run: |
          docker compose down -v --remove-orphans
          docker compose up -d db mailcatcher

      - name: Prepare database
        run: uv run bash scripts/prestart.sh
        working-directory: backend

      - name: Run pytest with coverage
        id: backend-tests
        continue-on-error: true
        working-directory: backend
        run: |
          set -o pipefail
          FASTAPI_ENV=development uv run coverage run -m pytest tests/ \
            --junitxml=pytest-results.xml \
            | tee pytest-output.txt

      - name: Generate coverage reports
        id: backend-coverage
        if: always()
        continue-on-error: true
        working-directory: backend
        run: |
          set -o pipefail
          uv run coverage report --fail-under=90 | tee coverage.txt
          uv run coverage html --title "TESENA Demo CI Coverage"

      - name: Backend test summary
        if: always()
        working-directory: backend
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import xml.etree.ElementTree as ET

          print("### Backend / Pytest")

          junit = Path("pytest-results.xml")

          if junit.exists():
              root = ET.parse(junit).getroot()

              if root.tag.endswith("testsuite"):
                  suites = [root]
              else:
                  suites = root.findall(".//testsuite")

              tests = sum(int(s.attrib.get("tests", 0)) for s in suites)
              failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
              errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
              skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
              passed = tests - failures - errors - skipped

              print(f"- ✅ Passed: **{passed}**")
              print(f"- ❌ Failed: **{failures + errors}**")
              print(f"- ⏭️ Skipped: **{skipped}**")
              print(f"- Total: **{tests}**")
          else:
              print("- ❌ JUnit result was not generated")

          coverage_file = Path("coverage.txt")

          if coverage_file.exists():
              totals = [
                  line
                  for line in coverage_file.read_text().splitlines()
                  if line.startswith("TOTAL")
              ]

              if totals:
                  coverage = totals[-1].split()[-1]
                  print(f"- Coverage: **{coverage}**")
                  print("- Required coverage: **>= 90%**")
          PY

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            backend/pytest-results.xml
            backend/pytest-output.txt
            backend/coverage.txt
            backend/htmlcov
          include-hidden-files: true
          retention-days: 30

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans

      - name: Enforce backend gates
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.backend-tests.outcome }}
          COVERAGE_OUTCOME: ${{ steps.backend-coverage.outcome }}
        run: |
          test "$TEST_OUTCOME" = "success"
          test "$COVERAGE_OUTCOME" = "success"

  frontend:
    name: Frontend / Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun ci
        working-directory: frontend

      - name: Build frontend
        id: frontend-build
        run: bun run build
        working-directory: frontend

      - name: Frontend summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.frontend-build.outcome }}
        run: |
          {
            echo "### Frontend / Build"
            if [ "$BUILD_OUTCOME" = "success" ]; then
              echo "✅ TypeScript + Vite build **PASSED**"
            else
              echo "❌ TypeScript + Vite build **FAILED**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  playwright:
    name: Playwright / E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.18"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Install backend dependencies
        run: uv sync
        working-directory: backend

      - name: Install frontend dependencies
        run: bun ci
        working-directory: frontend

      - name: Generate frontend client
        run: bash scripts/generate-client.sh

      - name: Build Compose images
        run: docker compose build

      - name: Prepare environment
        run: |
          docker compose down -v --remove-orphans
          rm -rf frontend/blob-report frontend/test-results frontend/playwright-report
          mkdir -p frontend/blob-report frontend/test-results
          docker compose run --rm backend bash scripts/prestart.sh

      - name: Run Playwright tests
        id: playwright-tests
        continue-on-error: true
        run: |
          docker compose run --rm \
            -e PLAYWRIGHT_JUNIT_OUTPUT_FILE=/app/frontend/test-results/playwright-results.xml \
            playwright \
            bunx playwright test \
            --fail-on-flaky-tests \
            --trace=retain-on-failure \
            --reporter=line,junit,blob

      - name: Generate Playwright HTML report
        id: playwright-report
        if: always()
        continue-on-error: true
        run: bunx playwright merge-reports --reporter html ./blob-report
        working-directory: frontend

      - name: Playwright summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import xml.etree.ElementTree as ET

          print("### Playwright / E2E")

          junit = Path("frontend/test-results/playwright-results.xml")

          if junit.exists():
              root = ET.parse(junit).getroot()

              if root.tag.endswith("testsuite"):
                  suites = [root]
              else:
                  suites = root.findall(".//testsuite")

              tests = sum(int(s.attrib.get("tests", 0)) for s in suites)
              failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
              errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
              skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
              passed = tests - failures - errors - skipped

              print(f"- ✅ Passed: **{passed}**")
              print(f"- ❌ Failed: **{failures + errors}**")
              print(f"- ⏭️ Skipped: **{skipped}**")
              print(f"- Total: **{tests}**")
          else:
              print("- ❌ JUnit result was not generated")

          print("- HTML report: **playwright-test-reports artifact**")
          PY

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-reports
          path: |
            frontend/playwright-report
            frontend/test-results
          include-hidden-files: true
          retention-days: 30

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans

      - name: Enforce Playwright gates
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.playwright-tests.outcome }}
          REPORT_OUTCOME: ${{ steps.playwright-report.outcome }}
        run: |
          test "$TEST_OUTCOME" = "success"
          test "$REPORT_OUTCOME" = "success"

  security:
    name: Security / Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build backend image
        run: docker compose build backend

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: backend:latest
          scanners: vuln
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from collections import Counter
          import json
          from pathlib import Path

          print("### Security / Trivy")

          report = Path("trivy-results.json")

          if not report.exists():
              print("❌ Trivy report was not generated")
              raise SystemExit(0)

          data = json.loads(report.read_text())
          severities = Counter()

          for result in data.get("Results", []):
              for vulnerability in result.get("Vulnerabilities") or []:
                  severities[vulnerability.get("Severity", "UNKNOWN")] += 1

          print(f"- CRITICAL: **{severities['CRITICAL']}**")
          print(f"- HIGH: **{severities['HIGH']}**")
          print("- Unfixed vulnerabilities: **ignored**")
          print("- Initial POC mode: **reporting only**")
          PY

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: trivy-results.json
          retention-days: 30
